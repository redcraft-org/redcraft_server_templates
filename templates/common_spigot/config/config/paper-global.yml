# Only the proxy settings are templated here, Paper fills in every other key with its
# defaults on first start. The _version key is left out on purpose so Paper assumes the
# version it ships with instead of replaying old config transformations.
#
# The secret below is a placeholder filled in at template build time, see
# config_env_matches in the rcst_template_*.json of every server built from this one.
# It has to match forwarding.secret on the Velocity proxy.
proxies:
  bungee-cord:
    online-mode: true
  proxy-protocol: false
  velocity:
    enabled: true
    online-mode: true
    secret: 'VELOCITY_FORWARDING_SECRET'

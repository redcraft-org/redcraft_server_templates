# MiniMOTD replaces ServerListPlus on the Velocity proxy.
# Text uses MiniMessage, see https://docs.papermc.io/adventure/minimessage/

# The list of MOTDs to display, one is picked at random on every ping
motds=[
    {
        icon="random"
        line1="<red><bold>Red</bold></red><white><bold>Craft</bold></white><gray><bold>.org</bold></gray> <gray>- Alpha"
        line2=""
    }
]

# Enable MOTD-related features
motd-enabled=true

# Server list icon handling is left to Velocity so that server-icon.png keeps being used
icon-enabled=false

player-count-settings {
    # Should the displayed online player count be allowed to exceed the displayed maximum player count?
    allow-exceeding-maximum=false
    # Setting this to true will disable the hover text showing online player usernames
    disable-player-list-hover=false
    # Setting this to true will hide the player count entirely
    hide-player-count=false
    # Changes the Max Players value, matches show-max-players in velocity.toml
    max-players=100
    max-players-enabled=true
}

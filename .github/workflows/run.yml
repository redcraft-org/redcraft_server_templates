name: Generate templates

on:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

jobs:
  run:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set git config
        run: |
          git config user.name RedCraft.org
          git config user.email contact@redcraft.org

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Settings
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      - name: Run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMON_MYSQL_PASSWORD: ${{ secrets.COMMON_MYSQL_PASSWORD }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DEEPL_TOKEN: ${{ secrets.DEEPL_TOKEN }}
          CLAUDE_TOKEN: ${{ secrets.CLAUDE_TOKEN }}
          SENTRY_DSN_HUB: ${{ secrets.SENTRY_DSN_HUB }}
          SENTRY_DSN_CREA_REDSTONE_PLOT: ${{ secrets.SENTRY_DSN_CREA_REDSTONE_PLOT }}
          SENTRY_DSN_CREA_BUILD_PLOT: ${{ secrets.SENTRY_DSN_CREA_BUILD_PLOT }}
          SENTRY_DSN_MUSEUM: ${{ secrets.SENTRY_DSN_MUSEUM }}
          VELOCITY_FORWARDING_SECRET: ${{ secrets.VELOCITY_FORWARDING_SECRET }}
        run: |
          ./setup.sh
          source env/bin/activate
          python generate_templates.py
          python check_updates.py

      - name: Keepalive workflow
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/run.yml/enable
